name: Create Release

# main へ PR がマージされたら、プラグインのルートファイルの Version をタグとしてリリースを作成する。
# 同じバージョンのタグが既に存在する場合はリリースをスキップする。
on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  PLUGIN_SLUG: ruijinen-block-patterns-r002-lp

jobs:
  check:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      released: ${{ steps.tag.outputs.released }}
    steps:
      - uses: actions/checkout@v7

      - name: Get plugin version
        id: version
        run: |
          version=$(sed -n 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*\([^[:space:]]*\).*/\1/p' "$PLUGIN_SLUG.php" | head -n 1)
          if [ -z "$version" ]; then
            echo "::error file=$PLUGIN_SLUG.php::Version header not found"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version=$version"

      - name: Check existing tag
        id: tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" > /dev/null; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag $VERSION already exists. Skip release."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.released == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # mise.toml に定義した Node.js をインストールする
      - name: Use Node.js
        uses: jdx/mise-action@v5

      - name: Install dependencies
        run: npm ci

      - name: Build css, js and images
        run: npm run build

      - name: Use PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer:v2
          coverage: none

      - name: Composer install
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Zip plugin
        run: zip -r "$PLUGIN_SLUG.zip" . -x@.distignore

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ "$PR_TITLE" != "$VERSION" ]; then
            echo "::warning::PR title ($PR_TITLE) differs from plugin version ($VERSION). Using plugin version."
          fi
          printf '%s\n' "$PR_BODY" > release-notes.md
          gh release create "$VERSION" "$PLUGIN_SLUG.zip" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file release-notes.md

  sync-dev:
    # リリースの成否（スキップ含む）に関わらず、main の内容を dev へ反映する PR を作成する
    needs: [check, release]
    if: always() && needs.check.result == 'success' && needs.release.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Create pull request main → dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -n "$(gh pr list --base dev --head main --state open --json number --jq '.[0].number // empty')" ]; then
            echo "Sync PR already exists."
            exit 0
          fi
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/compare/dev...main" --jq '.ahead_by')" = "0" ]; then
            echo "main has no commits to sync into dev."
            exit 0
          fi
          gh pr create --base dev --head main \
            --title "リリース残処理：mainの内容をdevへ反映" \
            --body "Pulling main into dev"
